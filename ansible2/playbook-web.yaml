- name: Sediakan web server
  hosts: nodes
  become: true
  vars:
    site_title: Armada Infratify
    site_owner: Pasukan Platform
    web_port: 80
  tasks:
    - name: Pasang nginx
      apt:
        name: nginx
        state: present
        update_cache: true
    - name: Hidupkan servis nginx
      service:
        name: nginx
        state: started
        enabled: true
    - name: Tulis index.html
      copy:
        content: "{{ site_title }} - {{ inventory_hostname }} - {{ site_owner }}\n"
        dest: /var/www/html/index.html
